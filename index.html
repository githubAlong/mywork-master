<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>教师工作台 · 登录</title>
<style>
:root{
  --page:#f0eef7; --bg:#fff; --panel-2:#f4f2fa; --border:rgba(30,26,60,.10); --border-strong:rgba(30,26,60,.18);
  --ink-1:#14122b; --ink-2:#3d3a55; --ink-3:#6f6b88;
  --accent:#6d5ae0; --accent-deep:#5743c7; --accent-soft:rgba(109,90,224,.10); --accent-line:rgba(109,90,224,.28);
  --accent-2:#d98324; --accent-2-soft:rgba(217,131,36,.14);
  --r-card:16px; --r-ctl:12px; --r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:var(--page);color:var(--ink-1);overflow:hidden}
button{font:inherit;cursor:pointer;border:0}
input{font:inherit;outline:none}
.wrap{height:100%;display:grid;grid-template-columns:1.15fr 1fr}
/* 左侧品牌 */
.brand{position:relative;overflow:hidden;background:linear-gradient(155deg,#6d5ae0 0%,#5743c7 70%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:6vw 5vw}
.brand .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none}
.brand .b1{width:420px;height:420px;right:-120px;top:-100px;background:#C4633F}
.brand .b2{width:360px;height:360px;left:-100px;bottom:-120px;background:#a99cf0}
.brand .logo{display:flex;align-items:center;gap:14px;margin-bottom:38px;position:relative;z-index:1}
.brand .mark{width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;letter-spacing:.02em}
.brand .name{font-size:22px;font-weight:800}
.brand .name small{display:block;font-size:12.5px;font-weight:500;opacity:.75;margin-top:2px;letter-spacing:.08em}
.brand h1{font-size:clamp(30px,3.2vw,46px);font-weight:800;line-height:1.25;position:relative;z-index:1}
.brand h1 em{font-style:normal;color:#e6d9ff}
.brand p{margin-top:16px;font-size:15.5px;line-height:1.8;opacity:.85;max-width:42ch;position:relative;z-index:1}
.brand .feats{display:flex;gap:26px;margin-top:34px;position:relative;z-index:1;flex-wrap:wrap}
.brand .feat{font-size:13.5px;opacity:.9;display:flex;align-items:center;gap:8px}
.brand .feat::before{content:"";width:7px;height:7px;border-radius:50%;background:#f0b89a}
/* 右侧表单 */
.form-side{display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:400px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-card);padding:34px 30px;box-shadow:0 28px 60px -24px rgba(15,35,34,.18)}
.card h2{font-size:24px;font-weight:800}
.card .sub{font-size:13.5px;color:var(--ink-3);margin:6px 0 24px}
.role{display:inline-flex;background:var(--panel-2);border-radius:var(--r-pill);padding:4px;gap:2px;margin-bottom:22px}
.role button{padding:8px 22px;border-radius:var(--r-pill);font-size:14px;color:var(--ink-3);font-weight:600}
.role button.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(15,35,34,.1)}
.field{margin-bottom:16px}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.field input{width:100%;height:48px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);padding:0 15px;font-size:15px;background:var(--panel-2)}
.field input:focus{border-color:var(--accent-line);background:#fff}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-3);margin:4px 0 22px}
.row a{color:var(--accent);text-decoration:none;font-weight:600}
.submit{width:100%;height:50px;border-radius:var(--r-ctl);background:var(--accent);color:#fff;font-size:16px;font-weight:700}
.submit:active{background:var(--accent-deep)}
.foot{margin-top:22px;text-align:center;font-size:12.5px;color:var(--ink-3)}
.foot a{color:var(--accent);text-decoration:none;font-weight:600}
@media(max-width:820px){
  .wrap{grid-template-columns:1fr;overflow-y:auto}
  .brand{padding:calc(env(safe-area-inset-top) + 48px) 26px 26px;min-height:280px;justify-content:flex-end}
  .brand .logo{margin-bottom:22px}
  .brand h1{font-size:28px}.brand p{font-size:14px}.brand .feats{display:none}
  .form-side{padding:20px 18px 40px}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="brand">
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="logo"><div class="mark">工</div><div class="name">我的教师工作台<small>TEACHER WORKBENCH · 学生端同步</small></div></div>
    <h1>把备课、考勤、任务，<br>收进<em>一个安静的工作台</em></h1>
    <p>面向高中信息技术教学的一体化个人工作台：上课、课表、备课、考勤、自习任务、资料站，教师端与学生端一套数据。</p>
    <div class="feats"><span class="feat">本地优先 · 离线可用</span><span class="feat">教师 / 学生双端</span><span class="feat">数据可备份</span></div>
  </section>
  <section class="form-side">
    <form class="card" onsubmit="return false">
      <h2>欢迎回来</h2>
      <div class="sub">请选择身份后登录</div>
      <div class="role">
        <button type="button" class="on">教师端</button>
        <button type="button">学生端</button>
      </div>
      <div class="field"><label>账号（11 位数字）</label><input inputmode="numeric" placeholder="请输入账号"></div>
      <div class="field"><label>密码</label><input type="password" placeholder="请输入密码"></div>
      <div class="row"><span>记住账号</span><a href="#">忘记密码？</a></div>
      <button class="submit" type="button" id="login-btn">登 录</button>
      <div class="foot">首次使用请联系管理员开通账号 · v2.0 设计稿<br><a href="app.html">真实工作台</a> · <a href="teacher.html">v2 教师端界面稿</a></div>
    </form>
  </section>
</div>
<script>
let role='teacher';
document.querySelectorAll('.role button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.role button').forEach(x=>x.classList.toggle('on',x===b));
  role=b.textContent.trim()==='学生端'?'student':'teacher';
});
document.getElementById('login-btn').onclick=()=>{
  /* 教师端进真实工作台（app.html 加载 js/main.js）；这一页本身不做登录校验，
     真实账号密码在 app.html 里过。学生端 student.html 是正式页面。 */
  location.href=role==='student'?'student.html':'app.html';
};
</script>
</body>
</html>
