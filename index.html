<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>教师工作台 · 登录</title>
<meta name="theme-color" content="#f2f6fb">
<!-- 这一页只做一件事：把访问者送到真实的教师工作台（app.html）。
     登录 / 注册的校验都在 app.html 内部完成，这里不再放任何展示稿或入口卡片，
     避免出现「这页点了登录、下页又要登一次」的双重登录。 -->
<script>
(function () {
  try {
    location.replace('app.html' + location.search + location.hash);
  } catch (e) {
    /* 极少数环境下 replace 被拦，退回赋值 */
    location.href = 'app.html' + location.search + location.hash;
  }
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=app.html"></noscript>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:#f2f6fb;color:#1f2a37;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .box{text-align:center;max-width:320px}
  .mark{
    width:56px;height:56px;border-radius:18px;margin:0 auto 18px;
    display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,#3b6ef6,#5b8cff);
    box-shadow:0 12px 26px -12px rgba(59,110,246,.7);
  }
  .mark svg{width:30px;height:30px;display:block}
  .title{font-size:16px;font-weight:700;letter-spacing:.01em}
  .hint{margin-top:8px;font-size:13px;color:#7b879b;line-height:1.7}
  .link{
    display:inline-block;margin-top:18px;padding:10px 20px;border-radius:12px;
    background:#3b6ef6;color:#fff;font-size:14px;font-weight:600;text-decoration:none;
  }
  .link:active{background:#2f5bd6}
</style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M4 18.2 24 8l20 10.2L24 28.5 4 18.2Z" fill="currentColor"/>
        <path d="M12 23.1v9.2c6.7 6.3 17.3 6.3 24 0v-9.2L24 29.2 12 23.1Z" fill="currentColor" opacity=".92"/>
        <path d="M43 19v13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="43" cy="34.5" r="2.2" fill="currentColor"/>
      </svg>
    </div>
    <div class="title">教师工作台</div>
    <div class="hint">正在进入登录页…<br>如果停留超过 2 秒，点下面的按钮。</div>
    <a class="link" href="app.html">进入登录</a>
  </div>
</body>
</html>
