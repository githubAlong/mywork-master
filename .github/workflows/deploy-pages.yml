name: Deploy mywork-master to GitHub Pages

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production master source
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Pages tooling
        run: npm install --no-save @playwright/test
      - name: Run project integrity checks
        run: npm run check
      - name: Run test suite (manual TEST acceptance is the release gate)
        run: npm test
        continue-on-error: true
      - name: Build production static site
        run: npm run build:pages
      - name: Upload production Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production master to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
